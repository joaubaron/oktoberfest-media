<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Prosit</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prosit">
<meta name="screen-orientation" content="portrait">
<meta name="theme-color" content="#03687e">
<link rel="icon" href="icone.png">
<style>

/* ====================== RESET / BODY ====================== */
body {
font-family: "Roboto", sans-serif;
text-align: center;
background: #f3f3f3;
background-image: url('azulbavaro.webp');
background-repeat: repeat;
margin: 0;
padding: 10px;
overflow-x: hidden;
}

/* ====================== TITULOS ====================== */
h1 {
color: #03687e;
margin-bottom: 10px;
}

/* ====================== TOPO ====================== */
.oktoberfest-title {
max-width: 94%;
height: auto;
display: block;
margin: 0 auto 10px auto;
font-family: inherit;
text-shadow: none;
box-shadow: none;
border-radius: 0;
position: relative;
z-index: 1000;
margin-top: 10px;
}

#titulo-img {
max-width: 90%;
}

/* ====================== INPUTS ====================== */
input {
padding: 10px;
font-size: 15px;
width: 160px;
text-align: center;
border: 2px solid #03687e;
border-radius: 8px;
color: #03687e;
box-sizing: border-box;
}

input:focus {
outline: none;
border-color: #03687e;
box-shadow: 0 0 0 3px rgba(11, 95, 165, 0.1);
}

/* ====================== BOTÕES PADRÃO ====================== */
button {
margin-left: 10px;
padding: 6px 12px;
font-size: 12px;
height: 34px;
background: #03687e;
color: white;
border: none;
border-radius: 8px;
cursor: pointer;
transition: background 0.3s;
display: flex;
align-items: center;
justify-content: center;
}

button:hover {
background: #025a6e;
}

button:disabled {
background: #ccc;
cursor: not-allowed;
}

/* ====================== CONTAINER DA IMAGEM ====================== */
#image-container {
margin-top: 7px;
position: relative;
display: inline-block;
z-index: 1;
}

#photo {
width: 83%;
max-height: none;
border: none;
border-radius: 0;
box-shadow: none;
transform: translateY(-5px);
transition: opacity 0.6s ease-in-out, transform 1.5s ease-in-out, filter 0.8s ease-in-out;
}

/* Remove filete e sombra apenas da imagem inicial oktoberfest.png */
#photo[src="fotos/oktoberfest.png"] {
border: none !important;
box-shadow: none !important;
border-radius: 0 !important;
}

/* ====================== TEXTOS ====================== */
.amarelo {
color: #D8B115;
}

.texto-azul {
color: #03687e;
font-size: 13.5px;
}

/* ====================== MODAL ====================== */
#alertModal {
position: fixed;
top: 50%;
left: 50%;
transform: translate(-50%, -50%) scale(0.7);
background: #ffffff;
padding: 20px 30px;
border-radius: 16px;
box-shadow: 0 8px 25px rgba(0,0,0,0.15);
text-align: center;
color: #333333;
font-size: 15px;
font-weight: 400;
display: none;
z-index: 1000;
max-width: 300px;
opacity: 0;
transition: transform 0.3s ease-out, opacity 0.3s ease-out;
}

#alertModal.show {
display: flex;
opacity: 1;
transform: translate(-50%, -50%) scale(1);
}

#alertModal .modal-content {
min-width: 250px;
max-width: 320px;
text-align: center;
display: flex;
flex-direction: column;
align-items: center;
}

#alertModal button {
margin-top: 14px;
padding: 6px 18px;
background: #03687e;
color: #fff;
border: none;
border-radius: 12px;
cursor: pointer;
font-size: 14px;
font-weight: 500;
transition: background 0.25s;
}

#alertModal button:hover {
background: #03687e;
}

/* ====================== CANVAS FOGOS ====================== */
canvas {
position: fixed;
top: 0;
left: 0;
pointer-events: none;
z-index: 999;
}

/* ====================== RESPONSIVO ====================== */
@media (max-width: 480px) {
.oktoberfest-title {
font-size: 1.5em;
}
input, button {
font-size: 14px;
padding: 8px 15px;
}
}

/* ====================== BOTÕES SUPERIORES (Clara e Vídeo) ====================== */
#drawButton, #videoButton {
height: 35px;
padding: 10px 20px;
font-size: 12px !important;
}

#drawButton {
background: #03687e;
color: white;
}

#drawButton:hover {
background: #025a6e;
}

#drawButton:disabled {
background: #ccc;
cursor: not-allowed;
}

#videoButton {
background: #D8B115;
color: #333;
}

#videoButton:hover {
background: #c19e10;
}

/* ====================== CAMPO "ano da Clara" ====================== */
#yearInput {
width: 130px;
height: 35px;
font-size: 12px;
padding: 10px;
border: 2px solid #03687e;
border-radius: 8px;
color: #03687e;
text-align: center;
box-sizing: border-box;
}

/* ====================== CONTAINER DO VÍDEO ====================== */
#video-container {
display: none;
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
justify-content: center;
align-items: flex-start;
z-index: 500;
}

/* ====================== VÍDEO ====================== */
#claraVideo {
border: 1.5px solid #000;
border-radius: 0;
box-shadow: none;
width: 83%;
margin-top: 0;
max-height: none;
z-index: 501;
}

/* ====================== BOTÕES INFERIORES (Prosit, 2007, Cartazes) ====================== */
#resetButton {
width: 120px;
}

#foto2007Button {
width: 90px;
}

#cartazes {
width: 95px;
}

/* ====================== CAMPO "ano do cartaz" ====================== */
#cartazInput {
width: 130px;
height: 34px;
font-size: 12px;
padding: 6px;
text-align: center;
border: 2px solid #03687e;
border-radius: 8px;
color: #03687e;
box-sizing: border-box;
}

/* ====================== BOTÃO "Ver cartaz" ====================== */
#cartazButton {
width: 115px;
}

/* ====================== BOTÃO MÚSICA ====================== */
#musicButton {
background: #D8B115;
color: #333;
font-size: 14px; 
width: 70px;
}

#musicButton:hover {
background: #c19e10;
}

/* ====================== INDICADOR DE OFFLINE ====================== */
body.offline::before {
content: "📴 Modo Offline";
position: fixed;
top: 10px;
right: 10px;
background: #ff4444;
color: white;
padding: 5px 10px;
border-radius: 5px;
font-size: 12px;
z-index: 10000;
animation: pulse 2s infinite;
} 

@keyframes pulse {
0% { opacity: 0.7; }
50% { opacity: 1; }
100% { opacity: 0.7; }
}

/* Ajustes para modo offline */
.offline .online-only {
opacity: 0.5;
pointer-events: none;
}

/* ====================== LAZY LOADING ====================== */
.lazy {
opacity: 0;
transition: opacity 0.3s ease-in;
}

.lazy-loaded {
opacity: 1;
}

/* Placeholder enquanto carrega */
.lazy-placeholder {
background: #f0f0f0;
display: flex;
align-items: center;
justify-content: center;
color: #03687e;
font-size: 14px;
}

/* ====================== PUSH (Animações de Troca) ====================== */
img {
transition: transform 0.6s ease-in-out, opacity 0.6s ease-in-out;
transform: translateX(0);
}

img.push-left {
transform: translateX(-100%);
}

img.push-right {
transform: translateX(100%);
}

/* ====================== BORDA PARA CARTAZES ====================== */
#photo[src*="cartaz"] {
border: 1px solid #000 !important;
border-radius: 0 !important;
box-shadow: none !important;
box-sizing: border-box;
}

/* ====================== BORDA PARA FOTOS DA CLARA ====================== */
#photo[src*="oktoberfest20"] {
border: 1px solid #000 !important;
border-radius: 0 !important;
box-shadow: none !important;
box-sizing: border-box;
}

/* 🔽 Diminui fonte dos botões principais */
#resetButton,
#foto2007Button,
#cartazes,
#cartazButton {
font-size: 13px !important;
padding: 5px 10px !important;
}

/* ====================== NOVOS ESTILOS APENAS PARA LARGURA TOTAL E CENTRALIZAÇÃO ====================== */

/* Linha do campo Clara + botão Vídeo */
.div-clara-video {
display: flex;
justify-content: center;
align-items: center;
gap: 10px;
width: 100%;
max-width: 100%;
margin: 10px auto;
padding: 0;
}

.div-clara-video #yearInput {
flex: 1;
max-width: none;
width: auto;
}

.div-clara-video #videoButton {
flex-shrink: 0;
}

/* Container dos 3 botões: Prosit, 2007, Ver cartazes */
.div-botoes-inferiores {
display: flex;
justify-content: center;
align-items: center;
gap: 10px;
width: 100%;
max-width: 100%;
margin: 5px auto;
font-size: 10px;
padding: 0;
}

.div-botoes-inferiores button {
flex: 1;
margin: 0;
}

/* Linha do campo Cartazes + botão Música */
.div-cartaz-musica {
display: flex;
justify-content: center;
align-items: center;
gap: 10px;
width: 100%;
max-width: 100%;
margin: 10px auto;
padding: 0;
}

.div-cartaz-musica #cartazInput {
flex: 1;
max-width: none;
width: auto;
}

.div-cartaz-musica #musicButton {
flex-shrink: 0;
}

/* 🔥 ESPAÇO NAS LATERAIS - BOTÕES NÃO FICAM COLADOS */
.div-clara-video,
.div-botoes-inferiores,
.div-cartaz-musica {
padding-left: 16px !important;
padding-right: 16px !important;
box-sizing: border-box !important;
}

/* Ajuste para telas pequenas */
@media (max-width: 600px) {
.div-clara-video,
.div-botoes-inferiores,
.div-cartaz-musica {
gap: 8px;
padding-left: 12px !important;
padding-right: 12px !important;
}
}

</style>
</head>
<body>

<div style="
position: fixed;
inset: 0;
background-image: url('azulbavaro.webp');
background-repeat: repeat;
opacity: 0.01;
pointer-events: none;
z-index: 0;
"></div>

<img
src="titulo.png"
alt="Título Oktoberfest"
class="oktoberfest-title"
id="titulo-img"
/>

<p class="texto-azul" id="claraOktoberfestText"></p>

<!-- Linha 1: Campo Clara + Botão Vídeo -->
<div class="div-clara-video">
<input type="number" id="yearInput" min="2017" placeholder="Ano da Clara na Oktoberfest 💞" style="width: 240px; font-size: 14px; padding: 14px 18px; text-align: center;" onkeypress="handleEnter(event, this)">
<button id="drawButton" style="display: none;">Clara 💞</button>  <!-- ⬅️ ADICIONE ESTA LINHA -->
<button id="videoButton">Vídeos</button>
</div>

<div id="video-container">
<video id="claraVideo" width="400" controls>
<source src="https://joaubaron.github.io/oktoberfest-media/videos/clara1.mp4" type="video/mp4">
Seu navegador não suporta o elemento de vídeo.
</video>
</div>

<img
src="rodape.png"
alt="Título Oktoberfest"
class="oktoberfest-title"
style="margin-top:15px; position: relative; z-index: 1001;"
/>

<div id="image-container">
<img
id="photo"
src="fotos/oktoberfest.png"
alt="Foto da Oktoberfest"
/>
</div>

<!-- Linha 2: Botões Prosit, 2007, Ver cartazes -->
<div class="div-botoes-inferiores">
<button id="resetButton" style="flex: 0.9;">Prosit&nbsp;<span id="anoVigente"></span></button>
<button id="foto2007Button" style="flex: 1.4;">Cláudia ❤️ Augusto</button>
<button id="cartazes" style="flex: 0.7;">Cartazes</button>
</div>

<!-- Linha 3: Campo Cartazes + Botão Música -->
<div class="div-cartaz-musica">
<input type="number" id="cartazInput" min="1984" placeholder="Cartazes entre 1984 e 2026 🥨" style="width: 235px; font-size: 14px; padding: 14px 18px; text-align: center;" onkeypress="handleEnter(event, this)">
<button id="musicButton">🎵🎶</button>
</div>

<p style="margin-top: 13px; font-size: 13px; color: #03687e;">
<a href="https://oktoberfestblumenau.com.br/" target="_blank"
style="color: inherit; text-decoration: none;">
Acesse o site oficial da Oktoberfest Blumenau
</a>
</p>
  
<audio id="backgroundMusic"></audio>
<canvas id="fireworks"></canvas>

<div id="alertModal">
<div class="modal-content">
<div style="margin-bottom: 8px;">Digite um ano entre</div>
<div>
<strong>2017 e <span id="modalYear"></span>! <span style="font-size: 20px;">🥨</span></strong>
</div>
<button>OK</button>
</div>
</div>

<script>
// Fecha teclado ao pressionar Enter nos campos de input
function handleEnter(event, inputElement) {
if (event.key === 'Enter') {
event.preventDefault();
inputElement.blur();

if (inputElement.id === 'yearInput') {
const drawButton = document.getElementById('drawButton');
if (drawButton) drawButton.click();
} else if (inputElement.id === 'cartazInput') {
const cartazButton = document.getElementById('cartazButton');
if (cartazButton) cartazButton.click();
}
}
}
</script>

<script>
// O Service Worker é registrado pelo app.js
// Detectar conectividade
window.addEventListener('online', () => {
console.log('🌐 Online - sincronizando...');
document.body.classList.remove('offline');
});

window.addEventListener('offline', () => {
console.log('📴 Offline - usando cache');
document.body.classList.add('offline');
});

// Verificar estado inicial
if (!navigator.onLine) {
document.body.classList.add('offline');
console.log('📱 Iniciando em modo offline');
}
</script>

<script src="app.js"></script>

<script>
// ====================== PULL-TO-REFRESH SIMPLES ======================
let pullStartY = 0;

document.addEventListener('touchstart', (e) => {
if (window.scrollY === 0) {
pullStartY = e.touches[0].clientY;
}
});

document.addEventListener('touchend', (e) => {
if (pullStartY > 0 && window.scrollY === 0) {
const pullEndY = e.changedTouches[0].clientY;
const pullDistance = pullEndY - pullStartY;

if (pullDistance > 80) {
window.location.reload(true);
}
}
pullStartY = 0;
});
</script>

</body>
</html>
